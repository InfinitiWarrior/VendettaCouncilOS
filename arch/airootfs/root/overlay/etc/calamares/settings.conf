# Vendetta Council OS (Arch) — Calamares, clone install (unpackfs from the
# archiso squashfs), so the installed system is the live system: all branding,
# theming, skel configs and the spydir toolkit carry over automatically.
# A "Desktop" + "Login screen" chooser drive a contextualprocess step that
# installs the chosen DE and strips KDE for a lean system.
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id: desktop
  module: packagechooser
  config: packagechooser.conf
- id: login
  module: packagechooser
  config: packagechooser-login.conf
- id: cleanup
  module: shellprocess
  config: shellprocess-cleanup.conf
- id: initcpio
  module: shellprocess
  config: shellprocess-initcpio.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - packagechooser@desktop
  - packagechooser@login
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - initcpiocfg
  - shellprocess@initcpio
  - vendettaboot
  - grubcfg
  - bootloader
  - services-systemd
  - contextualprocess
  - shellprocess@cleanup
  - umount
- show:
  - finished

branding: vendetta
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
