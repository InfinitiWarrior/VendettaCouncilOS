# Vendetta Council OS (Arch) — build the installed system's initramfs.
# The Calamares build we ship has no `initcpio` module, so this does its job.
# archiso leaves /boot empty in the image (the kernel lives on the ISO), and
# ships a live-only mkinitcpio drop-in; put the kernel back, drop the live
# hooks (initcpiocfg has already written the real ones), then generate.
---
dontChroot: false
timeout: 600
script:
  - "rm -f /etc/mkinitcpio.conf.d/archiso.conf"
  # no shell variables here: Calamares treats `$name` as one of its own.
  - "install -Dm644 /usr/lib/modules/*/vmlinuz /boot/vmlinuz-linux"
  - "mkinitcpio -P"
