# Vendetta Council OS — simple passwords allowed (parity with the Debian build).
---
defaultGroups:
    - wheel
    - video
    - audio
    - network
    - storage
    - power
    - rfkill
autoLoginGroup: autologin
doAutoLogin: false
sudoersGroup: wheel
sudoersConfigureWithGroup: false
setRootPassword: true
doReusePassword: true
passwordRequirements:
    minLength: 1
allowWeakPasswords: true
allowWeakPasswordsDefault: true
userShell: /bin/bash
setHostname: EtcFile
writeHostsFile: true
presets:
    fullName:
        editable: true
    loginName:
        editable: true
