# Vendetta Council OS (Arch) — pick the default login manager. All three ship
# preinstalled (switch anytime with `vendetta-dm`); this sets which is active on
# first boot. Choice lands in global storage as packagechooser_login.
---
mode: required
method: legacy
labels:
    step: "Login screen"
    aboutJob: "Login manager"

items:
  - id: sddm
    name: "SDDM (Vendetta)"
    description: "The riced Vendetta graphical login (Qt). Recommended default."
    packages: []
  - id: lightdm
    name: "LightDM (slick-greeter)"
    description: "Graphical GTK login — dark theme + Vendetta wallpaper."
    packages: []
  - id: greetd
    name: "greetd (tuigreet)"
    description: "Minimal cyan TUI login in the terminal. Hacker aesthetic."
    packages: []
