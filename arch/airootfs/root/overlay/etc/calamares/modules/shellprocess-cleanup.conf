# Vendetta Council OS (Arch) — strip live-only bits from the installed target:
# the live user + its autologin, the live passwordless-sudo + polkit rule, the
# installer launcher, and Calamares itself (matches the Debian build, which
# removes the installer post-install). Runs in the target chroot.
---
dontChroot: false
timeout: 180
script:
  - "pacman -Rns --noconfirm calamares 2>/dev/null || true"
  - "userdel -rf vendetta 2>/dev/null || true"
  - "groupdel autologin 2>/dev/null || true"
  - "rm -f /etc/sudoers.d/99-vendetta-live"
  - "rm -f /etc/sddm.conf.d/zz-live-autologin.conf"
  - "rm -f /etc/polkit-1/rules.d/49-vendetta-live.rules"
  - "rm -f /usr/share/applications/vendetta-install.desktop /usr/local/bin/vendetta-install"
  - "rm -rf /etc/systemd/system/getty@tty1.service.d"
  - "rm -rf /root/vendetta-hook.sh /root/spydir-setup.sh /root/overlay"
