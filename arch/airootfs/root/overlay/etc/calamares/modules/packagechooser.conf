# Vendetta Council OS (Arch) — pick the desktop to install.
# Legacy method: records the CHOICE to global storage as packagechooser_desktop
# (key = "packagechooser_" + the module INSTANCE id, so this is instanced as
# packagechooser@desktop in settings.conf). contextualprocess keys on it to
# install the chosen DE via pacman and strip KDE for the lean choices.
---
mode: required
method: legacy
labels:
    step: "Desktop"
    aboutJob: "Desktop environment"

items:
  - id: kde
    name: "Vendetta KDE Plasma"
    description: "The full riced Vendetta Council OS desktop — KDE Plasma 6. Installs offline. Recommended."
    packages: []
  - id: i3
    name: "i3 (tiling WM)"
    description: "Minimal keyboard-driven X11 tiling WM, Vendetta-riced (i3bar + rofi + kitty). Lean: KDE is removed. Needs internet."
    packages: []
  - id: hyprland
    name: "Hyprland (Wayland)"
    description: "Animated Wayland compositor, Vendetta-riced (waybar + wofi + swww, cyan borders + blur). Lean: KDE is removed. Needs internet."
    packages: []
  - id: sway
    name: "Sway (Wayland tiling)"
    description: "Wayland i3-style tiling compositor, Vendetta-riced (waybar + wofi + swaybg). Lean: KDE is removed. Needs internet."
    packages: []
  - id: xfce
    name: "XFCE"
    description: "Lightweight traditional desktop with the Vendetta dark/cyan theme + wallpaper. Lean: KDE is removed. Needs internet."
    packages: []
  - id: gnome
    name: "GNOME"
    description: "Modern GNOME desktop with Vendetta dark mode + wallpaper (keeps the Vendetta login screen). Lean: KDE is removed. Needs internet."
    packages: []
  - id: cinnamon
    name: "Cinnamon"
    description: "Traditional Cinnamon desktop with the Vendetta dark theme + wallpaper. Lean: KDE is removed. Needs internet."
    packages: []
