
# Vendetta Council OS — the EndeavourOS repo provides a prebuilt `calamares`
# (not in the Arch repos, not in chaotic-aur; greetd-tuigreet and
# lightdm-slick-greeter ARE in official extra, so no other third-party repo is
# needed). SigLevel=Never only during the build — mkarchiso's fresh airootfs
# keyring doesn't carry the EndeavourOS key when packages are verified. The
# installed system drops this repo (only `calamares` comes from it, and it's
# removed on install).
[endeavouros]
SigLevel = Never
Server = https://mirror.moson.org/endeavouros/repo/$repo/$arch
