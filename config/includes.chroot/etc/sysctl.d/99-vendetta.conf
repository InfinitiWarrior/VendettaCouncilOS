# Vendetta Council OS — desktop responsiveness. Safe, conservative knobs.
vm.swappiness = 10
vm.vfs_cache_pressure = 50
vm.dirty_background_ratio = 5
vm.dirty_ratio = 15
vm.dirty_writeback_centisecs = 1500

# BBR + fq: lower latency under load on modern kernels
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# no NMI watchdog on a desktop — saves a per-CPU timer
kernel.nmi_watchdog = 0

# bigger mmap count for games / Electron / Wine (kernel default on 6.11+, harmless)
vm.max_map_count = 1048576

# let unprivileged users use perf a bit (dev boxes); tighten if this is a kiosk
kernel.perf_event_paranoid = 2
