# Vendetta Council OS — override of calamares-settings-debian's packages module.
# Adds `calamares` itself so the installer is gone from the installed system
# (the base list already drops calamares-settings-debian + the live-* stack).
backend: apt

operations:
  - remove:
      - 'live-boot'
      - 'live-boot-doc'
      - 'live-config'
      - 'live-config-doc'
      - 'live-config-systemd'
      - 'live-tools'
      - 'live-task-localisation'
      - 'live-task-recommended'
      - 'calamares-settings-debian'
      - 'calamares'
