# Vendetta Council OS — pick the default login manager. All four are installed
# regardless (so you can switch anytime with `vendetta-dm`); this just sets
# which one is active on first boot. Choice lands in GS as packagechooser_login.
---
mode: required
method: legacy
labels:
    step: "Login screen"
    aboutJob: "Login manager"

items:
  - id: sddm
    name: "SDDM (Vendetta)"
    description: "The riced Vendetta graphical login (Qt). Recommended default."
    packages: []
  - id: lightdm
    name: "LightDM (slick-greeter)"
    description: "Graphical GTK login — dark theme + Vendetta wallpaper."
    packages: []
  - id: greetd
    name: "greetd (tuigreet)"
    description: "Minimal cyan TUI login in the terminal. Hacker aesthetic."
    packages: []
