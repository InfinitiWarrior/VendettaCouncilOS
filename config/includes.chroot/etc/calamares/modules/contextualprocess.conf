# Vendetta Council OS — install the chosen desktop + strip KDE for lean installs.
# Keyed on the packagechooser `desktop` selection (GS key packagechooser_desktop,
# confirmed from Calamares 3.3.14 source). The legacy packagechooser method only
# records the choice, so the actual install + KDE removal happens in the script,
# which runs in the target (contextualprocess dontChroot defaults false).
# Both branches log to /var/log/vendetta-install.log so the choice is always
# recorded — no log after an install means the chooser never wrote the choice.
---
packagechooser_desktop:
    kde:
        - command: "/usr/local/sbin/vendetta-desktop-setup kde"
          timeout: 120
    i3:
        - command: "/usr/local/sbin/vendetta-desktop-setup i3"
          timeout: 2400
    hyprland:
        - command: "/usr/local/sbin/vendetta-desktop-setup hyprland"
          timeout: 2400
    sway:
        - command: "/usr/local/sbin/vendetta-desktop-setup sway"
          timeout: 2400
    xfce:
        - command: "/usr/local/sbin/vendetta-desktop-setup xfce"
          timeout: 3000
    gnome:
        - command: "/usr/local/sbin/vendetta-desktop-setup gnome"
          timeout: 3600
    cinnamon:
        - command: "/usr/local/sbin/vendetta-desktop-setup cinnamon"
          timeout: 3600

# Apply the chosen default login manager. Runs after packagechooser_desktop
# (alphabetical order) which installs the DMs, so vendetta-dm can enable it.
# vendetta-dm no-ops safely if that DM didn't install (e.g. offline).
packagechooser_login:
    sddm:
        - command: "/usr/local/sbin/vendetta-dm sddm"
          timeout: 60
    lightdm:
        - command: "/usr/local/sbin/vendetta-dm lightdm"
          timeout: 60
    greetd:
        - command: "/usr/local/sbin/vendetta-dm greetd"
          timeout: 60
