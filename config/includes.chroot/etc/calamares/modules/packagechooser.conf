# Vendetta Council OS — pick the desktop to install.
# The selected item's `packages` are queued for the `packages` module to
# apt-install (needs network for anything but KDE, which is already in the
# live system). The chosen id lands in global storage as
# `packagechooser_desktop`, which contextualprocess.conf keys on to strip KDE
# for the leaner choices.
---
mode: required
# Single-selection uses the legacy method, which records the CHOICE to global
# storage (packagechooser_<instance-id>); install is done by contextualprocess.
# NB: the config `id:` field is ignored by Calamares — the GS key suffix comes
# from the module INSTANCE id, so this module is instanced as packagechooser@desktop
# in settings.conf to get the key `packagechooser_desktop`.
method: legacy
labels:
    step: "Desktop"
    aboutJob: "Desktop environment"

items:
  - id: kde
    name: "Vendetta KDE Plasma"
    description: "The full riced Vendetta Council OS desktop — KDE Plasma 6 on Wayland. Installs offline. Recommended."
    packages: []

  - id: i3
    name: "i3 (tiling WM)"
    description: "Minimal, keyboard-driven X11 tiling window manager, Vendetta-riced (i3bar + rofi + kitty). Lean: KDE is removed. Needs internet to install."
    # legacy method only records the choice; install is done by
    # vendetta-desktop-setup (contextualprocess) which needs the id, not this.
    packages: []

  - id: hyprland
    name: "Hyprland (Wayland)"
    description: "Animated Wayland compositor, Vendetta-riced (waybar + wofi + swww wallpaper, cyan borders + blur). From backports. Lean: KDE is removed. Needs internet to install."
    packages: []

  - id: sway
    name: "Sway (Wayland tiling)"
    description: "Wayland i3-style tiling compositor, Vendetta-riced (waybar + wofi + swaybg). Rock-solid. Lean: KDE is removed. Needs internet to install."
    packages: []

  - id: xfce
    name: "XFCE"
    description: "Lightweight traditional desktop with the Vendetta dark/cyan theme + wallpaper. Lean: KDE is removed. Needs internet to install."
    packages: []

  - id: gnome
    name: "GNOME"
    description: "Modern GNOME desktop with Vendetta dark mode, teal accent + wallpaper (keeps the Vendetta login screen). Lean: KDE is removed. Needs internet to install."
    packages: []

  - id: cinnamon
    name: "Cinnamon"
    description: "Traditional Cinnamon desktop with Vendetta dark theme + wallpaper. Lean: KDE is removed. Needs internet to install."
    packages: []
