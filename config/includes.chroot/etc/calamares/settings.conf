# Vendetta Council OS — Calamares settings (override of calamares-settings-debian).
# Adds a "Desktop" chooser (packagechooser) so the installer picks the desktop,
# and a contextualprocess step that strips KDE when a leaner one is chosen.
---
modules-search: [ local, /usr/lib/calamares/modules ]
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - packagechooser@desktop
  - packagechooser@login
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - luksbootkeyfile
  - dpkg-unsafe-io
  - sources-media
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - packagechooser@desktop
  - packagechooser@login
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - bootloader-config
  - grubcfg
  - bootloader
  - packages
  - contextualprocess
  - plymouthcfg
  - initramfscfg
  - initramfs
  - dpkg-unsafe-io-undo
  - sources-media-unmount
  - sources-final
  - umount
- show:
  - finished

# Instance the packagechooser as "desktop" so its choice lands in global storage
# under `packagechooser_desktop` (the key = "packagechooser_" + instance id, NOT
# the config `id:` field, which Calamares ignores). contextualprocess keys on it.
instances:
- id: desktop
  module: packagechooser
  config: packagechooser.conf
- id: login
  module: packagechooser
  config: packagechooser-login.conf

branding: debian
prompt-install: false
dont-chroot: false
