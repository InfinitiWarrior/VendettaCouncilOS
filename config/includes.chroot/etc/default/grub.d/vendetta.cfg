# Vendetta Council OS — GRUB defaults for the INSTALLED system.
# (The live ISO boot menu is themed separately under config/bootloaders/.)
GRUB_DISTRIBUTOR="Vendetta Council"
GRUB_BACKGROUND="/boot/grub/vendetta.png"
GRUB_GFXMODE="1920x1080,auto"
GRUB_TIMEOUT=3
GRUB_TIMEOUT_STYLE=menu

# quiet clean boot + desktop perf knobs (no extra packages: all in-kernel)
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash loglevel=3 rd.udev.log_level=3 nowatchdog transparent_hugepage=madvise zswap.enabled=1 zswap.compressor=zstd zswap.max_pool_percent=20"
