<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="140" version="1.1">
  <!-- Flat, zero-radius. Titlebar #04090A, 1px borders.
       Focused: cyan-30%-over-black (#134B48). Unfocused: #1B2A2C. -->

  <!-- ACTIVE -->
  <g>
    <rect id="decoration-topleft"     x="0"  y="0"   width="8"  height="40" fill="#04090A"/>
    <rect id="decoration-top"         x="8"  y="0"   width="84" height="40" fill="#04090A"/>
    <rect id="decoration-topright"    x="92" y="0"   width="8"  height="40" fill="#04090A"/>
    <rect id="decoration-left"        x="0"  y="40"  width="1"  height="99" fill="#134B48"/>
    <rect id="decoration-right"       x="99" y="40"  width="1"  height="99" fill="#134B48"/>
    <rect id="decoration-bottomleft"  x="0"  y="139" width="1"  height="1"  fill="#134B48"/>
    <rect id="decoration-bottom"      x="1"  y="139" width="98" height="1"  fill="#134B48"/>
    <rect id="decoration-bottomright" x="99" y="139" width="1"  height="1"  fill="#134B48"/>
    <rect id="decoration-border-top"  x="0"  y="0"   width="100" height="1" fill="#134B48"/>
  </g>

  <!-- INACTIVE -->
  <g>
    <rect id="decoration-inactive-topleft"     x="0"  y="0"   width="8"  height="40" fill="#04090A"/>
    <rect id="decoration-inactive-top"         x="8"  y="0"   width="84" height="40" fill="#04090A"/>
    <rect id="decoration-inactive-topright"    x="92" y="0"   width="8"  height="40" fill="#04090A"/>
    <rect id="decoration-inactive-left"        x="0"  y="40"  width="1"  height="99" fill="#1B2A2C"/>
    <rect id="decoration-inactive-right"       x="99" y="40"  width="1"  height="99" fill="#1B2A2C"/>
    <rect id="decoration-inactive-bottomleft"  x="0"  y="139" width="1"  height="1"  fill="#1B2A2C"/>
    <rect id="decoration-inactive-bottom"      x="1"  y="139" width="98" height="1"  fill="#1B2A2C"/>
    <rect id="decoration-inactive-bottomright" x="99" y="139" width="1"  height="1"  fill="#1B2A2C"/>
    <rect id="decoration-inactive-border-top"  x="0"  y="0"   width="100" height="1" fill="#1B2A2C"/>
  </g>
</svg>
