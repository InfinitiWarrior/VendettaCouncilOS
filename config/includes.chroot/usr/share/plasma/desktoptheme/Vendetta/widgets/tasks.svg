<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="500" version="1.1">
  <!-- Vendetta task buttons: flat, no fill. Active task = 2px cyan edge bar. -->
  <defs/>

  <!-- normal: nothing -->
  <g id="normal">
    <rect x="0"  y="0"   width="100" height="100" fill="none"/>
    <rect id="hint-left-margin"   x="0"  y="0" width="6" height="1" fill="none"/>
    <rect id="hint-right-margin"  x="94" y="0" width="6" height="1" fill="none"/>
    <rect id="hint-top-margin"    x="0"  y="0" width="1" height="6" fill="none"/>
    <rect id="hint-bottom-margin" x="0"  y="94" width="1" height="6" fill="none"/>
  </g>

  <!-- hover: faint raised surface -->
  <g id="hover">
    <rect x="0" y="100" width="100" height="100" fill="#0A181B"/>
    <rect id="hint-left-margin"   x="0"  y="100" width="6" height="1" fill="none"/>
    <rect id="hint-right-margin"  x="94" y="100" width="6" height="1" fill="none"/>
    <rect id="hint-top-margin"    x="0"  y="100" width="1" height="6" fill="none"/>
    <rect id="hint-bottom-margin" x="0"  y="194" width="1" height="6" fill="none"/>
  </g>

  <!-- focus (active task): surface + cyan bottom bar -->
  <g id="focus">
    <rect x="0"  y="200" width="100" height="100" fill="#0A181B"/>
    <rect x="41" y="296" width="18"  height="2"   fill="#37E6D8"/>
    <rect id="hint-left-margin"   x="0"  y="200" width="6" height="1" fill="none"/>
    <rect id="hint-right-margin"  x="94" y="200" width="6" height="1" fill="none"/>
    <rect id="hint-top-margin"    x="0"  y="200" width="1" height="6" fill="none"/>
    <rect id="hint-bottom-margin" x="0"  y="294" width="1" height="6" fill="none"/>
  </g>

  <!-- attention: cyan-hover tone -->
  <g id="attention">
    <rect x="0"  y="300" width="100" height="100" fill="#0A181B"/>
    <rect x="41" y="396" width="18"  height="2"   fill="#7CFFF3"/>
    <rect id="hint-left-margin"   x="0"  y="300" width="6" height="1" fill="none"/>
    <rect id="hint-right-margin"  x="94" y="300" width="6" height="1" fill="none"/>
    <rect id="hint-top-margin"    x="0"  y="300" width="1" height="6" fill="none"/>
    <rect id="hint-bottom-margin" x="0"  y="394" width="1" height="6" fill="none"/>
  </g>

  <!-- minimized: nothing (same as normal) -->
  <g id="minimized">
    <rect x="0" y="400" width="100" height="100" fill="none"/>
    <rect id="hint-left-margin"   x="0"  y="400" width="6" height="1" fill="none"/>
    <rect id="hint-right-margin"  x="94" y="400" width="6" height="1" fill="none"/>
    <rect id="hint-top-margin"    x="0"  y="400" width="1" height="6" fill="none"/>
    <rect id="hint-bottom-margin" x="0"  y="494" width="1" height="6" fill="none"/>
  </g>
</svg>
