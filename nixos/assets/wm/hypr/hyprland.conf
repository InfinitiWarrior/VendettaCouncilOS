$terminal = kitty
$menu     = wofi --show drun
$mod      = SUPER

monitor = , preferred, auto, auto

env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

general {
    gaps_in     = 6
    gaps_out    = 12
    border_size = 2
    col.active_border   = rgba(37e6d8ee) rgba(1b8f88ee) 45deg
    col.inactive_border = rgba(0a1416aa)
    resize_on_border = true
    layout = dwindle
}
decoration {
    rounding = 0
    active_opacity   = 1.0
    inactive_opacity = 0.94
    blur {
        enabled  = true
        size     = 6
        passes   = 2
        vibrancy = 0.15
    }
    shadow {
        enabled      = true
        range        = 12
        render_power = 2
        color        = rgba(00000055)
    }
}
dwindle {
    preserve_split = true
    smart_split    = false
}
misc {
    disable_hyprland_logo    = true
    disable_splash_rendering = true
}
ecosystem {
    no_update_news  = true
    no_donation_nag = true
}
input {
    kb_layout    = us
    follow_mouse = 1
    sensitivity  = 0.0
}

exec-once = waybar
exec-once = mako
exec-once = nm-applet --indicator
exec-once = swww-daemon
exec-once = sh -c 'sleep 1; swww img /usr/share/wallpapers/Vendetta/contents/images/1920x1080.png --transition-type grow --transition-pos center --transition-fps 60'

bind = $mod, Return, exec, $terminal
bind = $mod, D, exec, $menu
bind = $mod, Q, killactive,
bind = $mod, M, exit,
bind = $mod, V, togglefloating,
bind = $mod, F, fullscreen,
bind = $mod, J, togglesplit,

bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
