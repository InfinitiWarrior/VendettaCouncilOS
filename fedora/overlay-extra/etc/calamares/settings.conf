# Vendetta Council OS (Fedora) — Calamares, clone install. unpackfs copies the
# live base ext4 rootfs (/dev/mapper/live-base) so the installed system IS the
# live system: all branding/theme/skel/toolkit carry over. Desktop + login
# choosers drive a contextualprocess step (dnf) that installs the chosen DE and
# strips KDE for a lean system.
---
modules-search: [ local, /usr/lib64/calamares/modules, /usr/lib/calamares/modules ]

instances:
- id: desktop
  module: packagechooser
  config: packagechooser.conf
- id: login
  module: packagechooser
  config: packagechooser-login.conf
- id: cleanup
  module: shellprocess
  config: shellprocess-cleanup.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - packagechooser@desktop
  - packagechooser@login
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - dracutlukscfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - dracut
  - grubcfg
  - bootloader
  - services-systemd
  - contextualprocess
  - shellprocess@cleanup
  - umount
- show:
  - finished

branding: vendetta
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
