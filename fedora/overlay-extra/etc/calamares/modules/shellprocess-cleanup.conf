# Vendetta Council OS (Fedora) — strip live-only bits from the installed target:
# the live-session scripts (livesys), Calamares itself (matches the other
# builds), and the installer launcher. Schedule an SELinux relabel on first boot
# (the clone from live-base needs it). Runs in the target chroot.
---
dontChroot: false
timeout: 300
script:
  - "dnf -y remove calamares calamares-* 2>/dev/null || true"
  - "systemctl disable livesys.service livesys-late.service 2>/dev/null || true"
  - "rm -f /etc/sudoers.d/liveinst /etc/sudoers.d/99-vendetta-live"
  - "rm -f /etc/polkit-1/rules.d/49-vendetta-live.rules"
  - "rm -f /usr/share/applications/vendetta-install.desktop /usr/local/bin/vendetta-install"
  # the live desktop icon comes from /etc/skel, so the new user's home got one too
  - "rm -f /etc/skel/Desktop/vendetta-install.desktop /home/*/Desktop/vendetta-install.desktop"
  - "rm -rf /root/vendetta-hook.sh /root/spydir-setup.sh"
  - "touch /.autorelabel"
